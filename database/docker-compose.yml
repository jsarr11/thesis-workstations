version: '3.8'

# Οι τιμές διαβάζονται από το database/.env (δεν είναι στο git) — δες το .env.example.
services:
  postgres:
    image: postgres:15-alpine
    container_name: thesis-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thesis_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in database/.env}
      POSTGRES_DB: ${POSTGRES_DB:-thesis_workstations_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
